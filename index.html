let cur = 'ssq', nSets = 5;
const $ = id => document.getElementById(id);
const pad = n => (n < 10 ? '0' + n : '' + n);
function rnd(n){ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
function sample(min, max, k){ const pool = []; for (let i = min; i <= max; i++) pool.push(i); const out = []; for (let j = 0; j < k; j++) out.push(pool.splice(rnd(pool.length), 1)[0]); return out.sort((a,b) => a-b); }

function copyText(txt){ if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(() => toast('已复制')).catch(() => fallbackCopy(txt)); } else fallbackCopy(txt); }
function fallbackCopy(txt){ const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('已复制'); } catch(e){ toast('复制失败，请手动复制'); } document.body.removeChild(ta); }

function gen(){
  const pools = META[cur].pools.map(p => p.slice());

function renderHist(){
  const rows = DATA[cur].slice().reverse();

function renderStat(){
  const draws = DATA[cur]; let html = '';
  META[cur].statPools.forEach(sp => {
    const cnt = {}; for (let n = sp[0]; n <= sp[1]; n++) cnt[n] = 0;
    draws.forEach(d => {
      let nums = [];
      if (cur === 'ssq') nums = sp[2] === '红球' ? d[2] : [d[3]];
      else if (cur === 'dlt') nums = sp[2] === '前区' ? d[2] : d[3];
      else nums = d[2];
      nums.forEach(n => cnt[n]++);
    });
    const sorted = Object.keys(cnt).map(k => [parseInt(k,10), cnt[k]]).sort((a,b) => b[1]-a[1] || a[0]-b[0]);
    const hot = sorted.slice(0, sp[3]), cold = sorted.slice(-sp[3]).reverse();
    html += '<div><span class="tag">' + sp[2] + '热号</span>' + hot.map(x => pad(x[0]) + '(' + x[1] + '次)').join(' ') + '</div>';

  });
  $('stat').innerHTML = html;
}

(function(){
  function isDraw(d, mainN, mainMax, sub){
    if (!Array.isArray(d) || typeof d[0] !== 'string' || typeof d[1] !== 'string') return false;
    if (!Array.isArray(d[2]) || d[2].length !== mainN) return false;

  }

    return r.json();

    if (!validFresh(f)) return;
