name: 更新开奖数据

# 每天 22:30 北京时间跑一次：拉 17500 最新开奖，刷新 index.html 页内数据与页脚截至期号。
# 打开页面实时更新由 functions/api/draws.js（Cloudflare Pages 函数）负责；本任务是兜底层，
# 保证 GitHub Pages 上的版本和实时接口拉不到时的页内数据也不会太旧。
on:
  schedule:
    - cron: '30 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 拉取最新开奖并刷新 index.html
        run: python3 scripts/update_draws.py
      - name: 提交更新（如有变化）
        run: |
          git config user.name "lottery-bot"
          git config user.email "lottery-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "自动更新开奖数据"
          git push
